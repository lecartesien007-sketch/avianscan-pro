<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvianScan Pro</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2822/2822699.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        body { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); min-height: 100vh; }
        .prose { line-height: 1.6; color: #334155; }
        .prose table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        .prose th, .prose td { border: 1px solid #e2e8f0; padding: 6px; text-align: left; }
    </style>
</head>
<body class="p-4 text-slate-800">

    <div class="max-w-md mx-auto mb-6 flex justify-between items-center text-white">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">AvianScan Pro 🐔</h1>
            <p id="status" class="text-blue-400 text-xs font-medium uppercase tracking-widest">Connecté à l'IA</p>
        </div>
    </div>

    <div class="max-w-md mx-auto glass rounded-3xl p-6 shadow-2xl mb-6 border border-white/20">
        
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="processImage(event)">

        <div class="grid grid-cols-1 gap-4">
            <button onclick="triggerCamera('santé')" class="flex items-center justify-between bg-red-50 p-5 rounded-2xl border-2 border-red-100 active:scale-95 transition-all shadow-sm">
                <div class="flex items-center">
                    <div class="bg-red-500 p-3 rounded-xl mr-4 shadow-lg text-white text-xl">📸</div>
                    <div class="text-left">
                        <span class="block font-bold text-red-700">Diagnostic Santé</span>
                        <span class="text-xs text-red-500 italic">Analyse des fientes par IA</span>
                    </div>
                </div>
            </button>

            <button onclick="triggerCamera('carnet')" class="flex items-center justify-between bg-blue-50 p-5 rounded-2xl border-2 border-blue-100 active:scale-95 transition-all shadow-sm">
                <div class="flex items-center">
                    <div class="bg-blue-600 p-3 rounded-xl mr-4 shadow-lg text-white text-xl">📝</div>
                    <div class="text-left">
                        <span class="block font-bold text-blue-700">Scanner Carnet</span>
                        <span class="text-xs text-blue-500 italic">Comptabilité & Chiffres</span>
                    </div>
                </div>
            </button>
        </div>

        <div id="loading" class="mt-8 hidden text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-600 mb-2"></div>
            <p class="text-blue-600 font-bold">Expert Gemini en cours d'analyse...</p>
        </div>

        <div id="resultContainer" class="mt-8 p-4 bg-white rounded-2xl shadow-inner hidden border border-slate-100">
            <div id="resultContent" class="prose"></div>
            <button onclick="location.reload()" class="mt-4 w-full py-2 text-slate-400 text-xs font-semibold uppercase tracking-widest border-t pt-4">Nouveau Scan</button>
        </div>
    </div>

    <script>
        // Enregistrement du Service Worker pour le mode Hors-ligne
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        let currentType = '';

        function triggerCamera(type) {
            currentType = type;
            document.getElementById('cameraInput').click();
        }

        async function processImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            const resultContent = document.getElementById('resultContent');
            const status = document.getElementById('status');

            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            status.innerText = "Analyse IA...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64Image = reader.result.split(',')[1];
                
                try {
                    const response = await fetch('/api/analyze', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: base64Image, type: currentType })
                    });
                    
                    const data = await response.json();
                    
                    loading.classList.add('hidden');
                    resultContainer.classList.remove('hidden');
                    status.innerText = "Prêt";
                    
                    // Nettoyage simple du texte reçu pour l'affichage
                    resultContent.innerHTML = data.result.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                } catch (error) {
                    alert("Erreur réseau ou configuration. Vérifie ta clé Gemini sur Vercel.");
                    loading.classList.add('hidden');
                    status.innerText = "Échec";
                }
            };
        }
    </script>
</body>
</html>
